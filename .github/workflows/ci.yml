name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: visitas
          POSTGRES_PASSWORD: visitas
          POSTGRES_DB: visitas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visitas -d visitas"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://visitas:visitas@localhost:5432/visitas
      SECRET_KEY: ci-secret-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: El schema OpenAPI está al día
        run: |
          uv run python manage.py spectacular --file schema.yml --validate
          git diff --exit-code schema.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Los tipos generados están al día
        run: |
          npx openapi-typescript ../backend/schema.yml -o lib/api/schema.d.ts
          npx prettier --write lib/api/schema.d.ts
          git diff --exit-code lib/api/schema.d.ts
      - run: npm run lint
      - run: npx prettier --check .
      - run: npx tsc --noEmit
